<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Travel Experience</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>✈️Travel Experience</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="index.html#destinos">Destinos</a>
        </nav>
    </header>

<main class="area-cadastro">
    <form action="formCadastro">
        <h2>Planeje sua viagem!</h2>

        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="" id="email" placeholder="seu@gmail.com" required>
        <br><br>
        <label for="destino">Destino desejado:</label>
        <select name="destino" id="destino" required>
            <option value="">Escolha um destino</option>
            <option value="Rio de Janeiro">Rio de Janeiro</option>
            <option value="Paris">Paris</option>
            <option value="Maldivas">Maldivas</option>
        </select>
        <br><br>
        <button type="submit">Enviar cadastro</button>
        <p id="mensagem" aria-live="polite"></p>
        <a href="index.html" class="voltar">Voltar para o inicio</a>
    </form>
</main>
</body>
</html>
